
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #f4f6fb;
            min-height: 100vh;
            color: #1e293b;
        }

        /* Main Container */

        .main {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 15px;
        }

        /* Profile Card */

        .card {
            width: 450px;
            max-width: 100%;
            background: #ffffff;
            border-radius: 18px;
            padding: 35px;
            text-align: center;
            border: 1px solid #e8edf5;
            box-shadow: 0 10px 35px rgba(0,0,0,0.07);
            transition: 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.10);
        }

        /* Profile Header */

        .profile-header {
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid #f1f5f9;
        }

        .profile-header h2 {
            font-size: 21px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 7px;
        }

        .profile-header p {
            font-size: 12px;
            color: #94a3b8;
        }

        /* Profile Image Container */

        .profile-image {
            width: 155px;
            height: 155px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #eef2ff;
            box-shadow: 0 6px 20px rgba(79,70,229,0.15);
            background: #eef2ff;
            transition: 0.3s;
        }

        .profile-image:hover {
            transform: scale(1.05);
            border-color: #c7d2fe;
        }

        /* Student Image */

        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            border-radius: 50%;
        }

        /* Student Name */

        .card h3 {
            font-size: 24px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 10px;
        }

        /* Student Label */

        .student-label {
            display: inline-block;
            background: #eef2ff;
            color: #4f46e5;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.7px;
            margin-bottom: 25px;
        }

        /* Details Section */

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 13px;
            text-align: left;
        }

        /* Individual Detail Box */

        .detail-box {
            background: #f8fafc;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid #f1f5f9;
            transition: 0.3s;
        }

        .detail-box:hover {
            background: #eef2ff;
            border-color: #c7d2fe;
        }

        .detail-box label {
            display: block;
            font-size: 10px;
            font-weight: 800;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-box p {
            font-size: 14px;
            font-weight: 700;
            color: #334155;
            word-break: break-word;
        }

        /* Attendance Section */

        .attendance-box {
            background: #f8fafc;
            margin-top: 15px;
            padding: 16px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .attendance-box label {
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
        }

        .attendance {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
        }

        .present {
            background: #dcfce7;
            color: #15803d;
        }

        .absent {
            background: #fee2e2;
            color: #dc2626;
        }

        /* Home Button */

        .home-btn {
            display: block;
            width: 100%;
            background: #4f46e5;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            margin-top: 25px;
            transition: 0.3s;
        }

        .home-btn:hover {
            background: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(79,70,229,0.2);
        }

        /* Responsive Design */

        @media(max-width: 480px) {

            .card {
                padding: 25px 20px;
            }

            .profile-image {
                width: 130px;
                height: 130px;
            }

            .card h3 {
                font-size: 21px;
            }

            .detail-box {
                padding: 13px;
            }

            .detail-box p {
                font-size: 12px;
            }

        }

    </style>

</head>

<body>

    <div class="main">

        <div class="card">

            <!-- Profile Header -->

            <div class="profile-header">

                <h2>🎓 Student Profile</h2>

                <p>Student Information & Academic Details</p>

            </div>


            <!-- Student Image -->

            <div class="profile-image">

                <img src="{{ std[6] }}"
                     alt="{{ std[1] }}'s Profile"
                     onerror="this.src='https://placehold.co/200x200/eef2ff/4f46e5?text=Student'">

            </div>


            <!-- Student Name -->

            <h3>{{ std[1] }}</h3>

            <span class="student-label">
                STUDENT PROFILE
            </span>


            <!-- Student Details -->

            <div class="details">

                <div class="detail-box">

                    <label>Age</label>

                    <p>{{ std[2] }}</p>

                </div>


                <div class="detail-box">

                    <label>Gender</label>

                    <p>{{ std[3] }}</p>

                </div>


                <div class="detail-box">

                    <label>Marks</label>

                    <p>{{ std[4] }}</p>

                </div>


                <div class="detail-box">

                    <label>Course</label>

                    <p>{{ std[5] }}</p>

                </div>

            </div>


            <!-- Attendance -->

            <div class="attendance-box">

                <label>Attendance Status</label>

                {% if std[7] == 1 %}

                <span class="attendance present">
                    ● PRESENT
                </span>

                {% else %}

                <span class="attendance absent">
                    ● ABSENT
                </span>

                {% endif %}

            </div>


            <!-- Back to Dashboard -->

            <a href="/" class="home-btn">
                ← Back to Dashboard
            </a>

        </div>

    </div>

</body>

</html>
